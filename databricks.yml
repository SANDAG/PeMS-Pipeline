# This is a Declarative Automation Bundle definition for PeMS-Pipeline.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: PeMS-Pipeline5

include: 
  - resources/*.yml
 
sync:
  paths:
    - .
targets:
  dev:
    mode: development
    default: true
    workspace:
      # host: put your host URL of databricks here (https://xx.azuredatabricks.net)
      # Alternatively, you can keep your host/authentication in local Databricks CLI configuration and leave this blank.
      # e.g., in terminal, type: databricks auth login --host https://xx.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    
    run_as:
      user_name: ${workspace.current_user.userName}
    
    resources:
      pipelines:
        pems_pipeline5:
          catalog: sandbox
          schema: ${workspace.current_user.short_name}

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: xxx
